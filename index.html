<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸Mi Agenda Financiera🌸</title>
    <style>
        :root {
            --pink-pastel: #FFE5EC;
            --pink-dark: #FB6F92;
            --purple-pastel: #F0E6FF;
            --text-color: #4A4A4A;
            --bg-color: #FFF0F5;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .agenda-container {
            background: var(--card-bg);
            max-width: 450px;
            width: 100%;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(251, 111, 146, 0.15);
            border: 3px solid var(--pink-pastel);
            box-sizing: border-box; /* Evita que los elementos se desborden o queden corridos */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Título optimizado para que las flores queden siempre en paralelo */
        h1 {
            color: var(--pink-dark);
            font-size: 20px; 
            margin: 0 0 5px 0;
            white-space: nowrap; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        /* Sección de la Frase Diaria */
        .quote-box {
            background-color: var(--purple-pastel);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 25px;
            border-left: 5px solid var(--pink-dark);
        }

        /* Tarjeta de Balance */
        .balance-card {
            background: linear-gradient(135deg, var(--pink-pastel), #FFF);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(251, 111, 146, 0.2);
        }

        .balance-card h2 {
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7A7A7A;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink-dark);
            margin: 10px 0 0 0;
        }

        /* Formularios alineados perfectamente */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
        }

        input, select {
            padding: 12px;
            border: 2px solid var(--pink-pastel);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        /* Distribución proporcional para evitar desfases */
        input[type="text"] { width: 65%; }
        input[type="number"] { width: 35%; }
        select { width: 50%; background: white; }
        .btn-add { width: 50%; }

        input:focus, select:focus {
            border-color: var(--pink-dark);
        }

        button {
            background-color: var(--pink-dark);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff527b;
            transform: translateY(-1px);
        }

        /* Lista de Movimientos con botón de borrado */
        .transactions-list {
            margin-top: 25px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #F9F9F9;
            border-radius: 12px;
            margin-bottom: 10px;
            border-right: 4px solid #FFF;
            gap: 10px;
        }

        .transaction-item.ingreso { border-right-color: #87CCB9; }
        .transaction-item.gasto { border-right-color: var(--pink-dark); }

        .item-left {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-concept { font-weight: 600; font-size: 14px; word-break: break-word; }
        .item-type { font-size: 11px; color: #9B9B9B; }

        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-amount {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
        }
        .item-amount.ingreso { color: #55A38D; }
        .item-amount.gasto { color: var(--pink-dark); }

        /* Botón pequeño para eliminar de forma cute */
        .btn-delete {
            background: none;
            color: #A0A0A0;
            border: none;
            padding: 5px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .btn-delete:hover {
            color: var(--pink-dark);
            background-color: #FFF0F5;
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <div class="agenda-container">
        <header>
            <h1>🌸 Mi Agenda Financiera 🌸</h1>
            <p style="font-size: 13px; color: #888; margin: 0;">Organiza tus sueños, paso a paso</p>
        </header>

        <div class="quote-box" id="daily-quote">
            "Cada pequeña moneda ahorrada es un paso más hacia tu independencia."
        </div>

        <div class="balance-card">
            <h2>Balance del Mes</h2>
            <div class="balance-amount" id="total-balance">$0.00</div>
        </div>

        <div style="font-weight: bold; margin-bottom: 10px; font-size: 14px; color: var(--pink-dark);">✨ Registrar Movimiento</div>
        <div class="form-group">
            <input type="text" id="concept" placeholder="Ej. Venta de Agenda, Café...">
            <input type="number" id="amount" placeholder="Monto">
        </div>
        <div class="form-group">
            <select id="type">
                <option value="ingreso">🌸 Ingreso (+)</option>
                <option value="gasto">💸 Gasto (-)</option>
            </select>
            <button class="btn-add" onclick="addTransaction()">Añadir</button>
        </div>

        <div class="transactions-list">
            <div style="font-weight: bold; margin-bottom: 15px; font-size: 14px; color: #7A7A7A;">📅 Historial de este Mes</div>
            <div id="list-container">
                </div>
        </div>
    </div>

    <script>
        const quotes = [
            "✨ Controlar tu dinero es controlar tu libertad.",
            "🌸 ¡Tu negocio va a crecer tanto como cuides de él hoy!",
            "💸 Gastar con consciencia es una forma de amor propio.",
            "✨ No es cuánto ganas, sino qué tan bien lo gestionas.",
            "🌸 Cada inversión en ti misma florecerá a su tiempo.",
            "💸 Hoy elegiste cuidar tus metas. ¡Vas por muy buen camino!",
            "✨ El dinero es una herramienta para construir tus sueños."
        ];

        let balance = 0;

        window.onload = function() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('daily-quote').innerText = randomQuote;
        };

        function updateBalanceDisplay() {
            const totalBalance = document.getElementById('total-balance');
            totalBalance.innerText = `$${balance.toFixed(2)}`;
            if(balance < 0) {
                totalBalance.style.color = "#FB6F92"; 
            } else {
                totalBalance.style.color = "#55A38D";
            }
        }

        function addTransaction() {
            const conceptInput = document.getElementById('concept');
            const amountInput = document.getElementById('amount');
            const typeInput = document.getElementById('type');
            const listContainer = document.getElementById('list-container');

            const concept = conceptInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const type = typeInput.value;

            if (concept === '' || isNaN(amount) || amount <= 0) {
                alert('Por favor, introduce un concepto y un monto válido. 💕');
                return;
            }

            if (type === 'ingreso') {
                balance += amount;
            } else {
                balance -= amount;
            }

            updateBalanceDisplay();

            // Generar un ID único para poder borrar este elemento específico después
            const itemId = 'item-' + Date.now();

            const item = document.createElement('div');
            item.classList.add('transaction-item', type);
            item.setAttribute('id', itemId);

            item.innerHTML = `
                <div class="item-left">
                    <span class="item-concept">${concept}</span>
                    <span class="item-type">${type === 'ingreso' ? '🌸 Ingreso' : '💸 Gasto'}</span>
                </div>
                <div class="item-right">
                    <span class="item-amount ${type}">
                        ${type === 'ingreso' ? '+' : '-'}$${amount.toFixed(2)}
                    </span>
                    <button class="btn-delete" onclick="deleteTransaction('${itemId}', ${amount}, '${type}')" title="Borrar">✖️</button>
                </div>
            `;

            listContainer.insertBefore(item, listContainer.firstChild);

            conceptInput.value = '';
            amountInput.value = '';
        }

        // Nueva función para borrar el movimiento y recalcular de forma automática
        function deleteTransaction(id, amount, type) {
            const itemToDelete = document.getElementById(id);
            if (itemToDelete) {
                // Si borramos un ingreso, restamos ese dinero del balance. Si borramos un gasto, lo devolvemos.
                if (type === 'ingreso') {
                    balance -= amount;
                } else {
                    balance += amount;
                }
                
                // Actualizar la pantalla y remover el elemento visualmente
                updateBalanceDisplay();
                itemToDelete.remove();
            }
        }
    </script>
</body>
</html>
