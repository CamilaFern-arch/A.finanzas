<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸Mi Agenda Financiera ✨</title>
    <style>
        :root {
            --pink-pastel: #FFE5EC;
            --pink-dark: #FB6F92;
            --purple-pastel: #F0E6FF;
            --text-color: #4A4A4A;
            --bg-color: #FFF0F5;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .agenda-container {
            background: var(--card-bg);
            max-width: 450px;
            width: 100%;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(251, 111, 146, 0.15);
            border: 3px solid var(--pink-pastel);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--pink-dark);
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* Sección de la Frase Diaria */
        .quote-box {
            background-color: var(--purple-pastel);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 25px;
            border-left: 5px solid var(--pink-dark);
        }

        /* Tarjeta de Balance */
        .balance-card {
            background: linear-gradient(135deg, var(--pink-pastel), #FFF);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(251, 111, 146, 0.2);
        }

        .balance-card h2 {
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7A7A7A;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink-dark);
            margin: 10px 0 0 0;
        }

        /* Formularios e Inputs */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 12px;
            border: 2px solid var(--pink-pastel);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        select { flex: 1; background: white; }

        input:focus, select:focus {
            border-color: var(--pink-dark);
        }

        button {
            background-color: var(--pink-dark);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff527b;
            transform: translateY(-1px);
        }

        /* Lista de Movimientos */
        .transactions-list {
            margin-top: 25px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #F9F9F9;
            border-radius: 12px;
            margin-bottom: 10px;
            border-right: 4px solid #FFF;
        }

        .transaction-item.ingreso { border-right-color: #87CCB9; }
        .transaction-item.gasto { border-right-color: var(--pink-dark); }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-concept { font-weight: 600; font-size: 14px; }
        .item-type { font-size: 11px; color: #9B9B9B; }

        .item-amount {
            font-weight: bold;
            font-size: 15px;
        }
        .item-amount.ingreso { color: #55A38D; }
        .item-amount.gasto { color: var(--pink-dark); }

    </style>
</head>
<body>

    <div class="agenda-container">
        <header>
            <h1>🌸 Mi Agenda Financiera 🌸</h1>
            <p style="font-size: 13px; color: #888; margin: 0;">Organiza tus sueños, paso a paso</p>
        </header>

        <div class="quote-box" id="daily-quote">
            "Cada pequeña moneda ahorrada es un paso más hacia tu independencia."
        </div>

        <div class="balance-card">
            <h2>Balance del Mes</h2>
            <div class="balance-amount" id="total-balance">$0.00</div>
        </div>

        <div style="font-weight: bold; margin-bottom: 10px; font-size: 14px; color: var(--pink-dark);">✨ Registrar Movimiento</div>
        <div class="form-group">
            <input type="text" id="concept" placeholder="Ej. Venta de Agenda, Café...">
            <input type="number" id="amount" placeholder="Monto">
        </div>
        <div class="form-group">
            <select id="type">
                <option value="ingreso">🌸 Ingreso (+)</option>
                <option value="gasto">💸 Gasto (-)</option>
            </select>
            <button onclick="addTransaction()">Añadir</button>
        </div>

        <div class="transactions-list">
            <div style="font-weight: bold; margin-bottom: 15px; font-size: 14px; color: #7A7A7A;">📅 Historial de este Mes</div>
            <div id="list-container">
                </div>
        </div>
    </div>

    <script>
        // Array de frases motivadoras diarias
        const quotes = [
            "✨ Controlar tu dinero es controlar tu libertad.",
            "🌸 ¡Tu negocio va a crecer tanto como cuides de él hoy!",
            "💸 Gastar con consciencia es una forma de amor propio.",
            "✨ No es cuánto ganas, sino qué tan bien lo gestionas.",
            "🌸 Cada inversión en ti misma florecerá a su tiempo.",
            "💸 Hoy elegiste cuidar tus metas. ¡Vas por muy buen camino!",
            "✨ El dinero es una herramienta para construir tus sueños."
        ];

        let balance = 0;

        // Cambiar la frase aleatoriamente al cargar
        window.onload = function() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('daily-quote').innerText = randomQuote;
        };

        // Función para agregar ingresos o gastos
        function addTransaction() {
            const conceptInput = document.getElementById('concept');
            const amountInput = document.getElementById('amount');
            const typeInput = document.getElementById('type');
            const listContainer = document.getElementById('list-container');
            const totalBalance = document.getElementById('total-balance');

            const concept = conceptInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const type = typeInput.value;

            if (concept === '' || isNaN(amount) || amount <= 0) {
                alert('Por favor, introduce un concepto y un monto válido. 💕');
                return;
            }

            // Actualizar la suma o la resta automáticamente
            if (type === 'ingreso') {
                balance += amount;
            } else {
                balance -= amount;
            }

            // Actualizar el diseño del balance en pantalla
            totalBalance.innerText = `$${balance.toFixed(2)}`;
            if(balance < 0) {
                totalBalance.style.color = "#FB6F92"; 
            } else {
                totalBalance.style.color = "#55A38D";
            }

            // Crear el elemento en la lista (Estilo Agenda)
            const item = document.createElement('div');
            item.classList.add('transaction-item', type);

            item.innerHTML = `
                <div class="item-details">
                    <span class="item-concept">${concept}</span>
                    <span class="item-type">${type === 'ingreso' ? '🌸 Ingreso' : '💸 Gasto'}</span>
                </div>
                <span class="item-amount ${type}">
                    ${type === 'ingreso' ? '+' : '-'}$${amount.toFixed(2)}
                </span>
            `;

            // Insertar arriba en la lista
            listContainer.insertBefore(item, listContainer.firstChild);

            // Limpiar los campos del formulario
            conceptInput.value = '';
            amountInput.value = '';
        }
    </script>
</body>
</html>
